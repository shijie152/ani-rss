name: build-test

on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  # 先算出「这次改动碰到了哪些核心包」，让变异测试按包分片、并且没改就整体跳过。
  changes:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.detect.outputs.packages }}
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect changed core packages
        id: detect
        env:
          CORE_TEST_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CORE_TEST_FORMAT: json
        run: echo "packages=$(bash scripts/changed-packages.sh rss torrent source metadata subscription outbound)" >> "$GITHUB_OUTPUT"

  # 六个包各自一个 runner：单机并行没有收益（变异体逐个编译，被构建缓存锁串行化），
  # 分片才能把墙钟从「求和」压到「最慢的那个包」。
  mutation:
    needs: changes
    if: needs.changes.outputs.packages != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.packages) }}
    steps:
      - name: Check out
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go-backend/go.mod
          cache-dependency-path: go-backend/go.sum
      - name: Mutation test ${{ matrix.package }}
        run: bash scripts/test-core-mutations.sh ${{ matrix.package }}

  build:
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          # 核心测试（fuzz / 变异）按改动选包，需要能 diff 到基线提交。
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go-backend/go.mod
          cache-dependency-path: go-backend/go.sum
      - name: Quality gate
        run: bash ./scripts/check.sh
      - name: Fuzz core business boundaries
        env:
          CORE_TEST_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: FUZZ_TIME=5s bash scripts/test-core-fuzz.sh
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.31.0
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: ani-rss-ui/pnpm-lock.yaml
      - name: Test frontend behavior and mutations
        run: |
          corepack enable
          pnpm --dir ani-rss-ui install --frozen-lockfile
          pnpm --dir ani-rss-ui test
          pnpm --dir ani-rss-ui test:mutation
          pnpm --dir ani-rss-ui exec playwright install --with-deps chromium
          pnpm --dir ani-rss-ui test:browser
          pnpm --dir ani-rss-ui build
      - name: Build release smoke artifacts
        run: |
          corepack enable
          FORCE_UI_BUILD=1 ANI_RSS_VERSION=test ./scripts/build-go-release.sh
          ./scripts/smoke-go-release.sh
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Docker image (Go-only, no push)
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: false
          tags: |
            wushuo894/ani-rss:test
            ghcr.io/wushuo894/ani-rss:test

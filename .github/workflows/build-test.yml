name: build-test

on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go-backend/go.mod
          cache-dependency-path: go-backend/go.sum
      - name: Test Go backend
        run: |
          go test ./go-backend/...
          go test -race ./go-backend/...
          go vet ./go-backend/...
          git diff --check
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: ani-rss-ui/pnpm-lock.yaml
      - name: Build release smoke artifacts
        run: |
          corepack enable
          FORCE_UI_BUILD=1 ANI_RSS_VERSION=test ./scripts/build-go-release.sh
          ./scripts/smoke-go-release.sh
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Docker image (Go-only, no push)
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: false
          tags: |
            wushuo894/ani-rss:test
            ghcr.io/wushuo894/ani-rss:test

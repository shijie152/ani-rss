name: build-dmg

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go-backend/go.mod
          cache-dependency-path: go-backend/go.sum
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: ani-rss-ui/pnpm-lock.yaml
      - name: Build native macOS app
        run: |
          corepack enable
          pnpm --dir ani-rss-ui install --frozen-lockfile
          pnpm --dir ani-rss-ui build
          mkdir -p dist/macos
          version=$(sed -n '1p' VERSION)
          echo "version=v$version" >> "$GITHUB_ENV"
          go build -tags gui -trimpath -ldflags "-s -w -X main.version=$version" -o dist/macos/ani-rss-server ./go-backend/cmd/ani-rss
          ./scripts/package-macos.sh dist/macos/ani-rss-server ani-rss-ui/dist dist/macos
          hdiutil create -volname ANI-RSS -srcfolder dist/macos/ani-rss.app -ov -format UDZO dist/macos/ani-rss.dmg
      - name: Smoke test native server
        run: |
          mkdir -p "$RUNNER_TEMP/ani-rss-config"
          dist/macos/ani-rss-server --listen 127.0.0.1:17789 --ui-dir ani-rss-ui/dist --config-dir "$RUNNER_TEMP/ani-rss-config" >"$RUNNER_TEMP/ani-rss.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:17789/api/ping; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/ani-rss.log"
          exit 1
      - name: Smoke test application bundle and tray shell
        run: |
          mkdir -p "$RUNNER_TEMP/ani-rss-app-config"
          dist/macos/ani-rss.app/Contents/MacOS/ani-rss >"$RUNNER_TEMP/ani-rss-app.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:7789/api/ping; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/ani-rss-app.log"
          exit 1
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ env.version }}
          body_path: UPDATE.md
          tag_name: ${{ env.version }}
          append_body: false
          token: ${{ secrets.GITHUB_TOKEN }}
          files: ./dist/macos/ani-rss.dmg
